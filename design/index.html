<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Achadinhos Shopee Top</title>
<meta name="description" content="Central de achadinhos da Shopee — links diretos, testados e organizados por categoria.">
<meta property="og:title" content="Achadinhos Shopee Top">
<meta property="og:description" content="Os achadinhos que eu testei e recomendo. Abre direto na Shopee.">
<meta name="theme-color" content="#FBF8F2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:ital,wght@0,400..700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper-50:#FBF8F2;--paper-100:#F5F0E6;--paper-200:#ECE4D2;--paper-300:#D9CFB8;
  --ink-900:#1A1714;--ink-700:#3B342C;--ink-500:#6B6155;--ink-400:#8E8377;
  --clay-600:#C44A2F;--clay-500:#E5654B;--clay-400:#ED8369;--clay-100:#FBE5DD;
  --moss-600:#11635D;--moss-700:#0E4F4A;--moss-100:#DDEAE7;
  --error-600:#B23A2A;--error-100:#F6DDD6;
  --font-display:'Instrument Serif',Georgia,serif;
  --font-sans:'Instrument Sans',-apple-system,system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --shadow-sm:0 1px 2px rgba(60,45,30,.08),0 1px 1px rgba(60,45,30,.04);
  --shadow-md:0 4px 12px rgba(60,45,30,.08),0 1px 2px rgba(60,45,30,.05);
  --shadow-lg:0 14px 32px rgba(60,45,30,.12),0 2px 6px rgba(60,45,30,.06);
  --ease-out:cubic-bezier(.22,1,.36,1);--ease-soft:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper-50);color:var(--ink-900);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
a{color:var(--moss-600)}a:hover{color:var(--moss-700)}
::selection{background:var(--clay-100);color:var(--ink-900)}
:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(229,101,75,.28)}
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes toastUp{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}

.wrap{max-width:980px;margin:0 auto;padding:0 20px}
header.hero{padding:56px 0 28px;display:flex;flex-direction:column;gap:14px}
.eyebrow{display:flex;align-items:baseline;gap:10px}
.label{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-500)}
.rule{height:1px;flex:1;background:var(--paper-300)}
h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(40px,7vw,64px);line-height:1.05;letter-spacing:-.015em;text-wrap:balance}
h1 em{font-style:italic;color:var(--clay-500)}
.lede{margin:0;max-width:44ch;font-size:17px;line-height:1.65;color:var(--ink-700);text-wrap:pretty}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:var(--ink-400)}

.bar{position:sticky;top:0;z-index:20;background:rgba(251,248,242,.82);backdrop-filter:blur(12px) saturate(140%);border-bottom:1px solid var(--paper-200)}
.chips{display:flex;gap:8px;padding:12px 20px;max-width:980px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;cursor:pointer;font-family:var(--font-sans);font-size:14px;font-weight:500;padding:8px 14px;border-radius:999px;border:1px solid var(--paper-300);background:transparent;color:var(--ink-700);transition:background 120ms var(--ease-soft),color 120ms var(--ease-soft)}
.chip:hover{background:var(--paper-100)}
.chip[aria-pressed="true"]{background:var(--ink-900);border-color:var(--ink-900);color:#fff}
.chip span{font-family:var(--font-mono);font-size:11px;opacity:.6;margin-left:6px}

main{padding:28px 0 96px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
.card{animation:riseIn 380ms var(--ease-out) both;background:#fff;border-radius:14px;box-shadow:var(--shadow-sm);padding:22px;display:flex;flex-direction:column;gap:14px;transition:box-shadow 220ms var(--ease-soft),transform 220ms var(--ease-soft)}
.card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.clicks{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:var(--ink-400)}
.card h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:26px;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
.blurb{margin:0;font-size:15px;line-height:1.5;color:var(--ink-700);text-wrap:pretty}
.prices{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.price{font-family:var(--font-display);font-size:30px;line-height:1;color:var(--clay-600)}
.price-old{font-size:13px;color:var(--ink-400);text-decoration:line-through}
.off{font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.06em;color:var(--moss-600);background:var(--moss-100);padding:3px 8px;border-radius:999px}
.pending{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--error-600);background:var(--error-100);padding:4px 8px;border-radius:4px;align-self:flex-start}
.actions{margin-top:auto;padding-top:4px;display:flex;gap:8px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:10px;background:var(--clay-500);color:#fff;font-size:15px;font-weight:600;text-decoration:none;border:none;cursor:pointer;transition:background 120ms var(--ease-soft),transform 120ms var(--ease-soft)}
.btn:hover{background:var(--clay-400);color:#fff}
.btn:active{background:var(--clay-600);transform:scale(.98)}
.copy{flex:none;width:48px;height:48px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:10px;border:1px solid var(--paper-300);background:#fff;color:var(--ink-500);transition:background 120ms var(--ease-soft),color 120ms var(--ease-soft)}
.copy:hover{background:var(--paper-100)}
.copy.done{background:var(--clay-100);color:var(--clay-600);border-color:var(--clay-100)}
.copy .ico-done{display:none}
.copy.done .ico-copy{display:none}
.copy.done .ico-done{display:flex}
.foot{margin:48px 0 0;text-align:center;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-400)}
.toast{position:fixed;left:50%;bottom:28px;z-index:40;animation:toastUp 220ms var(--ease-out) both;background:#fff;box-shadow:var(--shadow-lg);border-radius:10px;padding:12px 18px;display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500;color:var(--ink-900)}
@media (min-width:720px){.wrap{padding:0 32px}.chips{padding:12px 32px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="eyebrow"><span class="label">central de links</span><span class="rule"></span></div>
    <h1>Achadinhos <em>Shopee</em> Top</h1>
    <p class="lede">Os achadinhos que eu testei e recomendo. Toque no produto para abrir direto na Shopee — se você tem o app instalado, ele abre lá.</p>
    <div class="meta"><span id="total">—</span><span>·</span><span>atualizado hoje</span><span>·</span><span>links de afiliado</span></div>
  </header>
</div>

<div class="bar"><div class="chips" id="chips"></div></div>

<div class="wrap">
  <main>
    <div class="grid" id="grid"></div>
    <p class="foot">os preços mudam · confira na Shopee antes de comprar</p>
  </main>
</div>

<script>
/* ---- Edite aqui: cada achadinho. `url` = seu link de afiliado. ---- */
const DATA = [
  { id:"airfryer", category:"Casa e cozinha", title:"Air fryer 5L com painel digital", blurb:"Esquenta rápido, cesta antiaderente e cabe frango inteiro. A que eu uso todo dia.", price:"R$ 289,90", priceOld:"R$ 429,00", off:"-32%", url:"https://s.shopee.com.br/50Z8YNMmiJ", clicks:1284 },
  { id:"organizador", category:"Casa e cozinha", title:"Organizador de geladeira (kit 4)", blurb:"Transparente, empilhável e encaixa nas prateleiras padrão. Resolve a bagunça em 10 minutos.", price:"R$ 39,90", priceOld:"R$ 69,90", off:"-43%", url:"", clicks:612 },
  { id:"serum", category:"Beleza e cuidados", title:"Sérum de vitamina C 30ml", blurb:"Textura leve, absorve rápido e não arde. Uso de manhã antes do protetor.", price:"R$ 34,50", priceOld:"R$ 59,90", off:"-42%", url:"", clicks:903 },
  { id:"secador", category:"Beleza e cuidados", title:"Escova secadora 3 em 1", blurb:"Seca e modela junto. Cerdas macias, dois níveis de calor e cabo bem comprido.", price:"R$ 119,00", priceOld:"R$ 189,00", off:"-37%", url:"", clicks:447 },
  { id:"conjunto", category:"Moda feminina", title:"Conjunto de linho manga bufante", blurb:"Tecido fresquinho, cai bem em qualquer corpo. Peguei no bege e no preto.", price:"R$ 79,90", priceOld:"R$ 139,90", off:"-43%", url:"", clicks:738 },
  { id:"legging", category:"Fitness", title:"Legging cintura alta sem transparência", blurb:"Compressão boa, não escorrega no agachamento e tem bolso lateral pro celular.", price:"R$ 49,90", priceOld:"R$ 99,90", off:"-50%", url:"", clicks:1562 }
];
const SORT = "Maior desconto"; // ou "Mais clicados"
const CATS = ["Tudo","Promoções do dia","Casa e cozinha","Beleza e cuidados","Moda feminina","Fitness"];

const KEY="achadinhos_clicks_v1";
const FALLBACK="https://s.shopee.com.br/";
let extra={}; try{extra=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
let active="Tudo", toastEl=null, toastT=null;

const pct=s=>parseInt(String(s).replace(/\D/g,""),10)||0;
const total=d=>d.clicks+(extra[d.id]||0);
const inCat=(d,c)=>c==="Tudo"||(c==="Promoções do dia"?pct(d.off)>=40:d.category===c);

const ICON_OUT='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M9 7h8v8"/></svg>';
const ICO_COPY='<span class="ico-copy" style="display:flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></span>';
const ICO_DONE='<span class="ico-done"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 12.5 5 5L20 6.5"/></svg></span>';

function toast(msg){
  if(toastEl) toastEl.remove();
  toastEl=document.createElement("div");
  toastEl.className="toast";
  toastEl.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E5654B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 12.5 5 5L20 6.5"/></svg><span></span>';
  toastEl.querySelector("span").textContent=msg;
  document.body.appendChild(toastEl);
  clearTimeout(toastT);
  toastT=setTimeout(()=>{ if(toastEl){toastEl.remove(); toastEl=null;} },2200);
}
function bump(d,el){
  extra[d.id]=(extra[d.id]||0)+1;
  try{localStorage.setItem(KEY,JSON.stringify(extra))}catch(e){}
  if(el) el.textContent=total(d).toLocaleString("pt-BR")+" cliques";
}
function renderChips(){
  const box=document.getElementById("chips");
  box.innerHTML="";
  CATS.forEach(c=>{
    const n=DATA.filter(d=>inCat(d,c)).length;
    if(!n && c!=="Tudo") return;
    const b=document.createElement("button");
    b.className="chip"; b.type="button";
    b.setAttribute("aria-pressed",String(c===active));
    b.innerHTML=c+' <span>'+n+'</span>';
    b.onclick=()=>{active=c;renderChips();renderGrid()};
    box.appendChild(b);
  });
}
function renderGrid(){
  const grid=document.getElementById("grid");
  grid.innerHTML="";
  let list=DATA.filter(d=>inCat(d,active));
  list.sort(SORT==="Maior desconto"?(a,b)=>pct(b.off)-pct(a.off):(a,b)=>total(b)-total(a));
  list.forEach(d=>{
    const pending=!d.url;
    const card=document.createElement("article");
    card.className="card";
    card.innerHTML=
      '<div class="card-top"><span class="label"></span><span class="clicks"></span></div>'+
      '<h2></h2><p class="blurb"></p>'+
      '<div class="prices"><span class="price"></span><span class="price-old"></span><span class="off"></span></div>'+
      (pending?'<span class="pending">link pendente</span>':'')+
      '<div class="actions">'+
        '<a class="btn" target="_blank" rel="noopener sponsored">Abrir na Shopee'+ICON_OUT+'</a>'+
        '<button class="copy" type="button" title="Copiar link" aria-label="Copiar link">'+ICO_COPY+ICO_DONE+'</button>'+
      '</div>';
    card.querySelector(".label").textContent=d.category;
    const cl=card.querySelector(".clicks");
    cl.textContent=total(d).toLocaleString("pt-BR")+" cliques";
    card.querySelector("h2").textContent=d.title;
    card.querySelector(".blurb").textContent=d.blurb;
    card.querySelector(".price").textContent=d.price;
    card.querySelector(".price-old").textContent=d.priceOld;
    card.querySelector(".off").textContent=d.off;
    const a=card.querySelector(".btn");
    a.href=d.url||FALLBACK;
    a.onclick=()=>{bump(d,cl); if(pending) toast("Troque este link pelo seu de afiliado.")};
    const cp=card.querySelector(".copy");
    cp.onclick=()=>{
      const url=d.url||FALLBACK;
      const done=()=>{cp.classList.add("done");toast(pending?"Link de exemplo copiado.":"Link copiado.");setTimeout(()=>cp.classList.remove("done"),1800)};
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(done,done)}else{done()}
    };
    grid.appendChild(card);
  });
  document.getElementById("total").textContent=DATA.length+" achadinhos";
}
renderChips();renderGrid();
</script>
</body>
</html>
